[profile]
move_in_earliest = "2026-09-15"
move_in_latest = "2026-09-28"
landing_duration_months_min = 1
landing_duration_months_max = 3
long_term_comparison_months = 12
monthly_budget_yen = 80000
visa_status = "working_holiday"
japanese_level = "N4"
applicant_gender = "male"
target_prefectures = ["Tokyo", "Kanagawa", "Saitama", "Chiba"]
allowed_housing_types = ["private_room", "1R", "1K"]
private_space_required = true
registration_required = true
strict_evidence = true
commute_anchors = ["Kichijoji Station", "Shibuya Station", "Shinjuku Station"]

[ranking]
# Arithmetic geographic centroid of the three commute anchors above.
anchor_label = "Kichijoji / Shibuya / Shinjuku midpoint"
anchor_latitude = 35.6840741
anchor_longitude = 139.6604630
price_weight = 0.60
distance_weight = 0.10
transit_weight = 0.20
bicycle_weight = 0.10
price_reference_yen = 80000
distance_reference_km = 20.0
transit_reference_minutes = 45.0
bicycle_reference_minutes = 45.0
missing_distance_penalty_km = 30.0
missing_transit_penalty_minutes = 90.0
missing_bicycle_penalty_minutes = 90.0
maximum_distance_km = 50.0

[routing]
enabled = true
provider = "google_routes"
cache_days = 7
max_elements_per_run = 900
batch_origins = 30
departure_weekday = 1 # Tuesday
departure_time = "08:30"
timezone = "Asia/Tokyo"

[[routing.anchors]]
id = "kichijoji"
label = "Kichijoji Station"
latitude = 35.7027778
longitude = 139.5797222

[[routing.anchors]]
id = "shibuya"
label = "Shibuya Station"
latitude = 35.6586111
longitude = 139.7013889

[[routing.anchors]]
id = "shinjuku"
label = "Shinjuku Station"
latitude = 35.6908333
longitude = 139.7002778

[runtime]
state_path = "state/housing.sqlite3"
artifacts_path = "artifacts"
dashboard_host = "127.0.0.1"
dashboard_port = 8766
global_workers = 8
per_host_workers = 2
max_queued_tasks = 16
per_host_interval_seconds = 0.75
list_page_budget_per_source = 100
detail_budget_per_source = 300
request_budget_per_run = 1200
connect_timeout_seconds = 5.0
read_timeout_seconds = 20.0
response_limit_bytes = 5242880
max_attempts = 3
circuit_failure_threshold = 5
checkpoint_every = 25
alert_limit = 20
partial_retry_minutes = 60
report_retention_days = 30
report_recent_runs = 42
report_retention_max_bytes = 1073741824
state_retention_days = 90
notification_max_attempts = 3
user_agent = "JapanHousingBot/0.1 (+local personal housing search)"
