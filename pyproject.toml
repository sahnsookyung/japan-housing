[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "japan-housing"
version = "0.1.0"
description = "Bounded foreigner-friendly housing monitor for Greater Tokyo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private" }
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
japan-housing = "japan_housing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/japan_housing"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "japan_housing/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
